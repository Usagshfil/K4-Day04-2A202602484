# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi thông tin còn thiếu hoặc xin xác nhận trước action. Luôn gửi response_type; với choice phải gửi toàn bộ options. Không dùng tool này để thực hiện action."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], description: "text cho ID/thông tin; yes_no cho confirmation; choice khi cần chọn enum"}
        options: {type: array, items: {type: string}, description: "[] cho text/yes_no; danh sách đầy đủ cho choice"}
      required: [question, response_type, options]

  - name: search_kb
    description: "Tìm hướng dẫn troubleshooting trong KB local, không phải live diagnostic. Chọn category chính xác: email gồm Outlook/mail profile; account chỉ cho account access/MFA."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], description: "Nhóm hướng dẫn; chọn email cho Outlook/mail profile và account cho access/MFA"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query, category]

  - name: check_service_status
    description: "Đọc trạng thái shared service, không chẩn đoán một device. Chỉ gọi khi service và environment đã rõ; environment mơ hồ phải dùng clarify thay vì tự chọn."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], description: "Môi trường được user xác định rõ"}
      required: [service, environment]

  - name: inspect_device
    description: "Đọc diagnostic của đúng một asset ID hợp lệ. Luôn gửi check; dùng category được user nêu, chỉ dùng all khi user yêu cầu kiểm tra toàn bộ. Không dùng employee ID hoặc từ như 'laptop' làm asset ID."
    parameters:
      type: object
      properties:
        asset_id: {type: string, pattern: "^(LT|DT|MB|PR|RM)-[0-9]{3}$", description: "Mã asset hợp lệ, ví dụ LT-204"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], description: "Nhóm kiểm tra được user yêu cầu; all chỉ khi không có nhóm cụ thể"}
      required: [asset_id, check]

  - name: lookup_user
    description: "Đọc directory record của đúng một employee ID hợp lệ. Không dùng cho asset lookup và không gọi inspect_device trừ khi user yêu cầu riêng một asset."
    parameters:
      type: object
      properties:
        employee_id: {type: string, pattern: "^EMP-[0-9]{4}$", description: "Mã nhân viên hợp lệ, ví dụ EMP-1003"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket và ghi state. Chỉ gọi sau khi user xác nhận rõ payload hiện tại; không dùng confirmed=false như dry-run hoặc để hỏi confirmation. Payload thay đổi làm confirmation cũ vô hiệu; khi chưa confirm, dùng clarify yes_no."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], description: "Mức ưu tiên đã được xác nhận"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        #confirmed: {type: boolean, enum: [true], description: "Chỉ true sau explicit confirmation cho payload hiện tại"}
        confirmed: {type: boolean, description: "Chỉ true sau explicit confirmation cho payload hiện tại"}
      required: [summary, priority, confirmed]
